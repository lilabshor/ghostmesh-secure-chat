worker_processes auto;
error_log /dev/null crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    access_log off;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options           DENY                                            always;
        add_header X-Content-Type-Options    nosniff                                         always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self'" always;
        add_header Referrer-Policy           no-referrer                                     always;
        add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()"  always;

        root  /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /ws {
            proxy_pass         http://ghostmesh:9000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_set_header   X-Real-IP         '';
            proxy_set_header   X-Forwarded-For   '';
            proxy_set_header   X-Forwarded-Proto '';
        }
    }
}